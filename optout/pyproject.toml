[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "optout"
version = "1.0.0"
description = "Audit and fix a website's opt-out from AI crawlers (robots.txt, TDMRep, noai)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
optout = "optout.cli:main"

[tool.setuptools]
packages = ["optout"]
