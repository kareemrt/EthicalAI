[project]
name = "fairhire"
version = "0.1.0"
description = "Bias audits for automated hiring decisions (NYC LL144 / EEOC four-fifths rule). Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
fairhire = "fairhire.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fairhire"]
