[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hireaudit"
version = "0.1.0"
description = "Open, dependency-free bias audits for automated hiring tools (NYC LL144 + EEOC four-fifths rule)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["fairness", "bias-audit", "hiring", "ai-ethics", "ll144", "four-fifths-rule"]

[project.scripts]
hireaudit = "hireaudit.cli:main"

[tool.setuptools]
packages = ["hireaudit"]
