[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "candor-lint"
version = "0.1.0"
description = "A linter for deceptive design (dark patterns) in UI markup and copy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["dark-patterns", "deceptive-design", "ethics", "accessibility", "linter", "consumer-protection"]

[project.scripts]
candor = "candor.cli:main"

[tool.setuptools]
packages = ["candor"]
