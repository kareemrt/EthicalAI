[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "candor"
version = "0.1.0"
description = "Find manipulative design (dark patterns) in web pages. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["dark-patterns", "ux", "ethics", "consumer-protection", "gdpr", "accessibility"]

[project.scripts]
candor = "candor.cli:main"

[tool.setuptools]
packages = ["candor"]
