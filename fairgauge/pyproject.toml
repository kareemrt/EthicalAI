[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fairgauge"
version = "0.1.0"
description = "Zero-dependency bias audits for automated decision tools (four-fifths rule, NYC LL144 impact ratios)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
fairgauge = "fairgauge.__main__:main"

[tool.setuptools]
packages = ["fairgauge"]
