[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "faircheck"
version = "0.1.0"
description = "Zero-dependency bias audit for automated decision systems (four-fifths rule, NYC Local Law 144)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
faircheck = "faircheck.cli:main"

[tool.setuptools]
packages = ["faircheck"]
