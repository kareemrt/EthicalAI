<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 542 84" width="542" role="img" aria-label="Impact ratios by sex"><style>
.lbl{font:12px system-ui,sans-serif;fill:var(--ink,#1f2328)}
