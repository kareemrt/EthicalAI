 stroke:var(--bg,#ffffff);stroke-width:4px;stroke-linejoin:round}
.axis{font:10px ui-monospace,monospace;fill:var(--muted,#6e7781)}
.grid{stroke:var(--line,#d0d7de);stroke-width:1}
