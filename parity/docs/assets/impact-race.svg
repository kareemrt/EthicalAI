 .grid{stroke:var(--line,#30363d)}.thr{stroke:var(--warn,#ff7b72)}
 .b-reference{fill:var(--ref,#58a6ff)}.b-ok{fill:var(--ok,#1f6feb)}
 .b-adverse{fill:var(--warn,#ff7b72)}}
