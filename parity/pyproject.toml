[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parity-audit"
version = "0.1.0"
description = "Zero-dependency bias audit for automated decision systems (four-fifths rule, NYC LL144, equal opportunity)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["fairness", "bias", "audit", "ai-ethics", "disparate-impact", "responsible-ai"]
dependencies = []

[project.scripts]
parity = "parity.cli:main"

[tool.setuptools]
packages = ["parity"]
