<text x="12" y="24" class="t">race — impact ratio</text>
<text x="180" y="60" class="lbl" text-anchor="end">American Indian or Alaska Native</text><rect x="190" y="48" width="360.0" height="16" rx="3" class="muted"/><text x="556.0" y="60" class="val">1.05</text><text x="180" y="86" class="lbl" text-anchor="end">White</text><rect x="190" y="74" width="360.0" height="16" rx="3" class="ok"/><text x="556.0" y="86" class="val">1.00</text><text x="180" y="112" class="lbl" text-anchor="end">Black or African American</text><rect x="190" y="100" width="346.2" height="16" rx="3" class="ok"/><text x="542.2" y="112" class="val">0.96</text><text x="180" y="138" class="lbl" text-anchor="end">Asian</text><rect x="190" y="126" width="345.3" height="16" rx="3" class="ok"/><text x="541.3" y="138" class="val">0.96</text><text x="180" y="164" class="lbl" text-anchor="end">Two or More Races</text><rect x="190" y="152" width="339.4" height="16" rx="3" class="ok"/><text x="535.4" y="164" class="val">0.94</text><text x="180" y="190" class="lbl" text-anchor="end">Hispanic or Latino</text><rect x="190" y="178" width="329.4" height="16" rx="3" class="ok"/><text x="525.4" y="190" class="val">0.91</text><text x="180" y="216" class="lbl" text-anchor="end">Native Hawaiian or Pacific Islander</text><rect x="190" y="204" width="241.7" height="16" rx="3" class="muted"/><text x="437.7" y="216" class="val">0.67</text>
<line x1="478.0" y1="40" x2="478.0" y2="234" class="th"/>
<text x="472.0" y="248" class="ax" text-anchor="end">four-fifths line 0.80</text>
