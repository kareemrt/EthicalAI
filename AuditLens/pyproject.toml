[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auditlens"
version = "0.1.0"
description = "Open, explainable bias audits for automated hiring tools (NYC LL144 / four-fifths rule), with intersectional and drift analysis."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["fairness", "bias-audit", "ai-ethics", "hiring", "ll144", "disparate-impact"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
auditlens = "auditlens.cli:main"

[tool.setuptools]
packages = ["auditlens"]
