<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-label="fairlens — bias audits for automated decisions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1e2a4a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="220" rx="16" fill="url(#bg)"/>
  <g transform="translate(64 62)">
    <circle cx="48" cy="48" r="44" fill="none" stroke="#4c6ef5" stroke-width="6"/>
    <circle cx="48" cy="48" r="26" fill="none" stroke="#2f9e77" stroke-width="6"/>
    <circle cx="48" cy="48" r="9" fill="#d9534f"/>
    <line x1="80" y1="80" x2="108" y2="108" stroke="#4c6ef5" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="210" y="112" font-size="56" font-weight="700" fill="#ffffff">fairlens</text>
  <text x="212" y="148" font-size="20" fill="#aab4c8">Bias audits for automated hiring, lending &amp; admissions decisions.</text>
  <g font-size="13" fill="#aab4c8">
    <rect x="212" y="166" width="132" height="26" rx="13" fill="#ffffff14"/><text x="278" y="183" text-anchor="middle">zero dependencies</text>
    <rect x="352" y="166" width="132" height="26" rx="13" fill="#ffffff14"/><text x="418" y="183" text-anchor="middle">four-fifths rule</text>
    <rect x="492" y="166" width="132" height="26" rx="13" fill="#ffffff14"/><text x="558" y="183" text-anchor="middle">NYC LL144 ratios</text>
    <rect x="632" y="166" width="132" height="26" rx="13" fill="#ffffff14"/><text x="698" y="183" text-anchor="middle">CI-ready exit codes</text>
  </g>
  <g transform="translate(800 52)">
    <rect x="0" y="0" width="100" height="14" rx="4" fill="#4c6ef5"/>
    <rect x="0" y="24" width="88" height="14" rx="4" fill="#2f9e77"/>
    <rect x="0" y="48" width="58" height="14" rx="4" fill="#d9534f"/>
    <line x1="80" y1="-8" x2="80" y2="72" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3"/>
