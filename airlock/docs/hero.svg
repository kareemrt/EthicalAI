<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="Untrusted content passes through Airlock before reaching an AI agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="880" height="230" rx="14" fill="url(#bg)"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="30" font-weight="700" fill="#f8fafc">Airlock</text>
    <text x="40" y="78" font-size="15" fill="#94a3b8">Check untrusted text for prompt injection before your AI reads it.</text>

    <!-- inputs -->
    <g font-size="13" fill="#e2e8f0">
      <rect x="40" y="105" width="170" height="28" rx="6" fill="#334155"/><text x="54" y="124">🌐  web pages</text>
      <rect x="40" y="141" width="170" height="28" rx="6" fill="#334155"/><text x="54" y="160">📄  résumés · emails</text>
      <rect x="40" y="177" width="170" height="28" rx="6" fill="#334155"/><text x="54" y="196">🧩  docs · tool output</text>
    </g>
    <path d="M220 155 H330" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- airlock -->
    <rect x="340" y="105" width="200" height="100" rx="12" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <text x="440" y="134" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">airlock</text>
    <text x="440" y="156" font-size="12" fill="#cbd5e1" text-anchor="middle">scan · explain · sanitize</text>
    <text x="440" y="180" font-size="11" fill="#64748b" text-anchor="middle">invisible text · hidden HTML</text>
    <text x="440" y="195" font-size="11" fill="#64748b" text-anchor="middle">override phrases · exfil links</text>

    <!-- outputs -->
    <path d="M550 135 H660" stroke="#5fd38d" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M550 178 H660" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="670" y="117" width="170" height="34" rx="6" fill="#14532d"/>
    <text x="755" y="139" font-size="13" fill="#dcfce7" text-anchor="middle">✅ clean text → agent</text>
    <rect x="670" y="160" width="170" height="34" rx="6" fill="#7f1d1d"/>
    <text x="755" y="182" font-size="13" fill="#fee2e2" text-anchor="middle">⛔ quarantine + report</text>
  </g>
</svg>
