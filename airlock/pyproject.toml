[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-scan"
version = "0.1.0"
description = "Check untrusted text for prompt injection before an AI agent reads it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["prompt-injection", "llm", "ai-safety", "security", "agents"]

[project.scripts]
airlock = "airlock.cli:main"

[tool.setuptools]
packages = ["airlock", "airlock.detectors"]
