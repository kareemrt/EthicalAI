[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "candor"
version = "0.1.0"
description = "Find deceptive design patterns (dark patterns) in web pages. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["dark-patterns", "deceptive-design", "ethics", "consumer-protection", "gdpr", "accessibility", "lint"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
candor = "candor.cli:main"

[tool.setuptools]
packages = ["candor"]
