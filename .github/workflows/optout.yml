name: optout
on:
  push:
    paths: ["optout/**", ".github/workflows/optout.yml"]
  pull_request:
    paths: ["optout/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: optout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m optout check examples/protected --strict
