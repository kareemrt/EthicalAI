name: parity
on:
  push:
    paths: ["parity/**", ".github/workflows/parity.yml"]
  pull_request:
    paths: ["parity/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: pip install . && parity examples/applicants.csv -y advanced -g sex -g race -l qualified
