name: AuditLens

on:
  push:
    paths: ["AuditLens/**", ".github/workflows/auditlens.yml"]
  pull_request:
    paths: ["AuditLens/**", ".github/workflows/auditlens.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    defaults:
      run:
        working-directory: AuditLens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Demo audit (expects adverse impact in the synthetic data)
        run: python -m auditlens demo --out /tmp/demo --suppress-below 5
