name: ghostcite
on:
  push:
    paths: ["ghostcite/**", ".github/workflows/ghostcite.yml"]
  pull_request:
    paths: ["ghostcite/**", ".github/workflows/ghostcite.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: ghostcite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m ghostcite examples/ai_answer.md || test $? -eq 1   # exit 1 = suspects found (expected)
