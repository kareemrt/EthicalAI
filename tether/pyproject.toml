[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tether"
version = "0.1.0"
description = "Check that every sentence of an AI-generated answer is backed by its sources."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
tether = "tether.cli:main"

[tool.setuptools]
packages = ["tether"]
