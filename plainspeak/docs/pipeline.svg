<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
  <style>
    .box{fill:#ffffff;stroke:#d9d6cc;stroke-width:1.5}
    .t{fill:#1d1d1f;font-size:15px;font-weight:600}
    .s{fill:#6b6b70;font-size:12px}
    .a{stroke:#9a9aa1;stroke-width:1.5;fill:none;marker-end:url(#h)}
    .acc{fill:#1f8a5b}
    @media (prefers-color-scheme:dark){.box{fill:#1e1e21;stroke:#3a3a40}.t{fill:#ececee}.s{fill:#9a9aa1}}
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#9a9aa1"/></marker></defs>

  <rect class="box" x="10" y="85" width="140" height="80" rx="12"/>
  <text class="t" x="80" y="120" text-anchor="middle">notice.txt</text>
  <text class="s" x="80" y="140" text-anchor="middle">letter · form · email</text>

  <path class="a" d="M150 125 H195"/>
  <rect class="box" x="200" y="85" width="140" height="80" rx="12"/>
  <text class="t" x="270" y="114" text-anchor="middle">text.py</text>
  <text class="s" x="270" y="134" text-anchor="middle">sentences · words</text>
  <text class="s" x="270" y="150" text-anchor="middle">syllables · offsets</text>

  <path class="a" d="M340 110 C365 110 365 40 390 40"/>
  <path class="a" d="M340 125 H390"/>
  <path class="a" d="M340 140 C365 140 365 210 390 210"/>

  <rect class="box" x="395" y="12" width="190" height="56" rx="10"/>
  <text class="t" x="490" y="36" text-anchor="middle">Readability</text>
  <text class="s" x="490" y="54" text-anchor="middle">grade level · sentence length</text>
  <rect class="box" x="395" y="97" width="190" height="56" rx="10"/>
  <text class="t" x="490" y="121" text-anchor="middle">Language</text>
  <text class="s" x="490" y="139" text-anchor="middle">jargon · passive · long sentences</text>
  <rect class="box" x="395" y="182" width="190" height="56" rx="10"/>
  <text class="t" x="490" y="206" text-anchor="middle">Essentials</text>
  <text class="s" x="490" y="224" text-anchor="middle">deadline · action · help · appeal</text>

  <path class="a" d="M585 40 C610 40 610 110 635 110"/>
  <path class="a" d="M585 125 H635"/>
  <path class="a" d="M585 210 C610 210 610 140 635 140"/>
  <rect class="box" x="640" y="85" width="100" height="80" rx="12"/>
  <text class="t" x="690" y="117" text-anchor="middle">Score</text>
  <text class="s" x="690" y="137" text-anchor="middle">0–100 · A–F</text>
  <text class="s" x="690" y="153" text-anchor="middle">capped penalties</text>

  <path class="a" d="M740 125 H765"/>
  <rect x="770" y="40" width="100" height="40" rx="8" class="acc" opacity=".12"/>
  <text class="t" x="820" y="65" text-anchor="middle" font-size="13">terminal</text>
  <rect x="770" y="105" width="100" height="40" rx="8" class="acc" opacity=".12"/>
