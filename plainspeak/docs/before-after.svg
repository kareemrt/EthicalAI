<style>.box{fill:#fff;stroke:#d9d6cc;stroke-width:1.5}.h{font-size:16px;font-weight:700}.k{fill:#6b6b70;font-size:14px}.v{fill:#1d1d1f;font-size:14px;font-weight:600}.track{fill:#ece9e1}
